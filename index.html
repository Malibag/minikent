	margin: 0;
	padding: 0;
	border: 0;

	background-color: #ffffff;

	touch-action: none;
}

	background-color: #121a2e;
}

	display: block;
}

	position: absolute;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 3vh;
	background-color: inherit;

#yukleme.bitti {
	opacity: 0;
	pointer-events: none;
}

#yukleme-logo {
	width: min(72vw, 420px);
	max-height: 46vh;
	object-fit: contain;
}

#yukleme-cubuk {
	position: relative;
	width: min(88vw, 640px);
	aspect-ratio: 1275 / 174;
}

#yukleme-cubuk img {
	position: absolute;
	top: 0;
	height: 100%;
	pointer-events: none;
	user-select: none;
}

#cubuk-bos, #cubuk-dolu {
	left: 0;
	width: 100%;
}

/* Dolu kısım ve ev yalnız transform ile kayar: oyun motoru açılırken sayfa betiği dursa da tarayıcı bu
   hareketleri çizmeye devam eder (ev yolun ortasında takılmasın). */
#dolu-kap {
	position: absolute;
	inset: 0;
	overflow: hidden;
	transform: translateX(-100%);
	will-change: transform;
}

#cubuk-dolu {
	transform: translateX(100%);
	will-change: transform;
}

#cubuk-ev {
	position: absolute;
	top: 0;
	left: 0;
	width: 12.94%;
	height: 100%;
	will-change: transform;
}

#ev-resim {
	left: 0;
	width: 100%;
	animation: sallan 1.6s ease-in-out infinite;
}

@keyframes sallan {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-3%); }
}

#yukleme-yazi {
	position: absolute;
	bottom: 2.5vh;
	left: 0;
	right: 0;
	text-align: center;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 12px;
	letter-spacing: 0.02em;
	color: #a9a9a9;
}

body.gece #yukleme-yazi {
	color: #5f6b85;
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	z-index: 11;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}

		const silYazi = (cik) => "Hesabın, e-postan ve profil bilgilerin kalıcı olarak silinecek. Onay kayıtların kanun gereği 3 yıl saklanır. " +
			(cik ? "Karakterin bu gece trenle şehirden ayrılır." : "Karakterin şehirde otomatik yaşamaya devam eder.") + " Emin misin?";
		q("#kontrol-karakter-sil").addEventListener("change", (e) => { if (silTur === "hesap") q(".sil-yazi").textContent = silYazi(e.target.checked); });

			silTur = tur;
			const h = tur === "hesap";

				? silYazi(false)
				: "Cinsiyet ve doğum tarihin silinecek. Emin misin?";
			pen.querySelectorAll(".sil-sifre").forEach((x) => { x.hidden = !h; });
			pen.querySelectorAll(".sil-karakter").forEach((x) => { x.hidden = !(h && karakter); });
			q("#kontrol-karakter-sil").checked = false;
			q(".sil-onay").textContent = h ? "Hesabımı sil" : "Sil";
			sifre3.value = "";

			q(".sil").hidden = false;

		q(".profil-sil").addEventListener("click", () => window.miniakentSilAc("profil"));

		q(".vazgec").addEventListener("click", () => { if (silTur === "profil") window.miniakentProfilAc(); else kapat(); });
		q(".sil-onay").addEventListener("click", async () => {
			const u = auth.currentUser, b = q(".sil-onay");
			if (!u) return;

				} else {

					const d = {};
					izinYaz(d, u.uid, { eposta: false, instagram: false, reklam: false }, "hesap_silme");  // onayların bittiği an kayda geçer
					// "Karakterimi de şehirden çıkar": gece treni bu isteği okur, ad bu gece şehirden ayrılır ve geri
					// gelmez (cikarilanlar.txt); kural yalnız karakterin sahibine izin verir (kullanıcı, 2026-11-11)
					const cik = !!karakter && q("#kontrol-karakter-sil").checked;
					if (cik) d["cikis_istegi/" + anahtar(karakter)] = serverTimestamp();

			if (e.target.matches("input:not([type=checkbox])")) setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 300);
		});
		q(".unuttum").addEventListener("click", async () => {
			if (!eposta.value.trim()) {
				yaz("Önce e-postanı yaz.", true);
				return;
			}
			try {
				await fa.sendPasswordResetEmail(auth, eposta.value.trim());
				yaz("Şifre yenileme bağlantısını e-postana gönderdik.");
			} catch (err) {
				hata(err);
			}
		});
		// e-postası doğrulanmış oyuncu: karakteri bağlıysa pencere kapanır, değilse Instagram kodu gösterilir
		const baglan = async (u) => {
			q(".bekle").hidden = true;
			if ((await get(ref(db, "oyuncu/" + u.uid + "/karakter"))).val()) { kapat(); return; }
			const s = (await get(ref(db, "sahip/" + anahtar(aday)))).val();
			if (s && s !== u.uid) { yaz("Bu karakter başka bir hesaba bağlı.", true); return; }
			await u.getIdToken(true);  // e-posta doğrulaması veritabanı kurallarına da yansısın
			// aynı karakter için 23 saati dolmamış kod varsa o gösterilir; "Kontrolü Al"a yeniden basınca yeni kod çıkıp
			// gönderilen eski kod geçersiz olmasın (kullanıcı, 2026-11-12: "bazı kullanıcılar 2 kod atıyor")
			const eski = (await get(ref(db, "dogrulama/" + u.uid))).val();
			const kod = eski && eski.h === aday && typeof eski.t === "number" && Date.now() - eski.t < 23 * 3600 * 1000 ? eski.kod
				: String(100000 + crypto.getRandomValues(new Uint32Array(1))[0] % 900000);
			if (!eski || kod !== eski.kod) await set(ref(db, "dogrulama/" + u.uid), { h: aday, kod: kod, t: serverTimestamp() });
			q(".kod").textContent = kod;
			q(".giris").hidden = q(".bul").hidden = q(".giris-alt").hidden = true;
			q(".dogrula").hidden = false;
			yaz("");

			q(".kim").hidden = true;
			q(".giris").hidden = q(".dogrula").hidden = q(".alt").hidden = q(".bekle").hidden = true;
			q(".bul").hidden = q(".giris-alt").hidden = q(".simdilik").hidden = false;

			oneri.hidden = true;
			yaz("");

				const b = document.createElement("button");
				b.type = "button";
				b.textContent = h;
				oneri.appendChild(b);
			}
			oneri.hidden = !l.length;
		});

			const b = e.target.closest("button");
			if (b) { ad.value = b.textContent; oneri.hidden = true; }
		});

			if (!sade(ad.value)) { yaz("Önce Instagram adını yaz.", true); return; }

			if (!h) { yaz("Bu ad şehirde yok. Takip ettikten sonraki ilk gece trenle şehre gelirsin.", true); return; }

			if (window.minikentSearch) window.minikentSearch(h);  // kamera karaktere gider

				await baglan(auth.currentUser);
			} catch (err) {
				hata(err);
			}
			q(".bul-git").disabled = false;
		});

			if (pen.hidden || q(".dogrula").hidden) return;
			yaz("Doğrulandı. Karakterin artık senin.");
			setTimeout(kapat, 1500);
		};

		const tamam = async (u) => {

		window.miniakentKontrolAc = async (h, kayit) => {

			pen.hidden = false;

					if (u.emailVerified) await tamam(u);

				} catch (err) {
					hata(err);
				}
				return;
			}
			if (aday) eposta.focus();
		};

		// bu sayfa, kullanıcı 2026-11-08): doğrulama burada yapılır, adres temizlenir. Şifre yenileme gibi öteki bağlantılar
		// Firebase'in kendi sayfasına gönderilir.
		const B = new URLSearchParams(location.search);
		let baglantiHata = false;
		const baglanti = (async () => {
			if (!B.get("mode") || !B.get("oobCode")) return;
			if (B.get("mode") !== "verifyEmail") {
				location.replace("https://miniakent.firebaseapp.com/__/auth/action" + location.search);
				return;
			}
			history.replaceState(null, "", location.pathname);
			try {
				await fa.applyActionCode(auth, B.get("oobCode"));
			} catch (err) {
				baglantiHata = err && err.code === "auth/expired-action-code";  // daha önce kullanılmışsa uyarı yok
			}
		})();
		// yükleme ekranı kalkınca: giriş yapmamışa hesap penceresi; doğrulanmış ama karakteri bağlı olmayana "Karakterini bul"
		window.miniakentGirisAc = async () => {
			await baglanti;
			await auth.authStateReady();
			const u = auth.currentUser;
			if (u) {
				try { await u.reload(); } catch (err) {}
				if (u.emailVerified && (await get(ref(db, "oyuncu/" + u.uid + "/karakter"))).val()) return;
			}
			window.miniakentKontrolAc("");
			if (baglantiHata && !(u && u.emailVerified)) {
				yaz("Bu doğrulama bağlantısının süresi dolmuş. Giriş yap, yeni bağlantı gönderelim.", true);

		};

		// beta kartlarındaki tik: "lacivert" (Premium), "sari" (Instagram'la doğrulanmış) ya da ""
		window.miniakentRozet = async (h) => {
			const k = anahtar(h);
			const [s, p] = await Promise.all([get(ref(db, "sahip/" + k)), get(ref(db, "premium/" + k))]);
			return p.val() === true ? "lacivert" : s.exists() ? "sari" : "";
		};
	}
} catch (e) {
	console.warn("Firebase", e);
}

#mkb[hidden], #mkb [hidden] { display: none !important; }

	background: var(--krem); border: 2px solid var(--kenar); font: 700 22px/1 var(--fb); color: var(--yazi); padding: 0; }

#mkb .fk-deklansor:active { transform: scale(.93); }

#mkb .fo-renkler button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); padding: 0; }

#mkb .ust2 { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: var(--en); display: flex; gap: 8px; }

#mkb .cip { padding: 6px 12px; border-radius: 999px; background: var(--krem); border: 2px solid var(--kenar); font-weight: 700; font-size: 11px; }
#mkb .cevrim { position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); left: 16px; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
#mkb .mkb-liste { position: absolute; top: calc(98px + env(safe-area-inset-top, 0px)); z-index: 9; display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow-y: auto;
	padding: 6px; border-radius: 14px; background: var(--krem); border: 2px solid var(--kenar); }
#mkb .mkb-liste button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 10px; font-weight: 700; font-size: 12px; }
#mkb .mkb-liste button.soluk { color: var(--soluk); }
#mkb #mkb-oneri { top: auto; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: var(--en); }
#mkb #mkb-bolge { top: auto; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); left: calc(50% + var(--en) / 2 - 210px); width: 210px; }
#mkb .avatar { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--deniz); color: #fbe9cb;
	font: 700 14.5px/1 var(--fb); border: 2px solid var(--kenar); }
#mkb .nokta { position: absolute; top: 2px; left: 32px; width: 12px; height: 12px; border-radius: 50%; background: var(--kiremit); border: 2px solid var(--krem); }

#mkb .ray { position: absolute; left: 0; top: calc(162px + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; flex-direction: column; gap: 8px;
	transition: transform .3s cubic-bezier(.2,.8,.2,1); }
#mkb .sekme { position: relative; display: flex; align-items: center; gap: 2px; padding: 5px 7px 5px 5px; border-radius: 0 999px 999px 0;

	transform: translateX(-105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }

	padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"mainPack":"index-v202611121551.pck","fileSizes":{"index-v202611121551.pck":6980736,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const yukleme = document.getElementById('yukleme');
	const cubuk = document.getElementById('yukleme-cubuk');
	const kap = document.getElementById('dolu-kap');
	const dolu = document.getElementById('cubuk-dolu');
	const ev = document.getElementById('cubuk-ev');
	const statusNotice = document.getElementById('status-notice');
	// Çubuk 1700 birim: ev parçası 220 birim; solu 250'den 1450'ye (çubuğun ucu) ilerler, dolu kısım evin
	// altına kadar görünür. İndirme sürerken her karede yerleştirilir; indirme bitince kalan yol tarayıcının
	// kendi animasyonuna verilir (motor açılırken sayfa betiği dursa da ev ilerlemeye devam eder).
	let hedef = 0;    // ulaşılması gereken ilerleme
	let gorunen = 0;  // ekrandaki ilerleme, hedefe yumuşakça yaklaşır
	let son = false;  // indirme bitti: hareket tarayıcı animasyonunda
	let anims = [];
	let bitti = false;

	function konum(g) {
		const w = cubuk.clientWidth;
		const x = 250 + g * 1200;
		const gizli = w - (x + 60) / 1700 * w;
		return [
			'translateX(' + (x / 1700 * w) + 'px)',
			'translateX(' + (-gizli) + 'px)',
			'translateX(' + gizli + 'px)',
		];
	}

	function kay(g0, g1, ms) {
		const a = konum(g0);
		const b = konum(g1);
		const opt = { duration: ms, easing: 'cubic-bezier(0.25, 0.6, 0.35, 1)', fill: 'forwards' };
		anims = [ev, kap, dolu].map((el, i) => el.animate([{ transform: a[i] }, { transform: b[i] }], opt));
		return Promise.all(anims.map((an) => an.finished));
	}

	function ilerle(p) {
		hedef = Math.max(hedef, Math.min(1, p));
	}

	function ciz() {
		if (son || !yukleme.isConnected) {
			return;
		}
		gorunen += (hedef - gorunen) * 0.08;
		if (hedef - gorunen < 0.001) {
			gorunen = hedef;
		}
		const k = konum(gorunen);
		ev.style.transform = k[0];
		kap.style.transform = k[1];
		dolu.style.transform = k[2];
		requestAnimationFrame(ciz);
	}
	requestAnimationFrame(ciz);

	// İndirme bitti: ev kalan yolun çoğunu motor açılırken yavaşça alır.
	function sonaDogru() {
		if (son) {
			return;
		}
		son = true;
		kay(gorunen, 0.96, 9000);
	}

	function kapat() {
		if (bitti) {
			return;
		}
		bitti = true;
		sonaDogru();
		anims.forEach((an) => an.updatePlaybackRate(6));
		Promise.all(anims.map((an) => an.finished)).then(() => kay(0.96, 1, 350)).then(() => {
			yukleme.classList.add('bitti');  // ev çubuğun ucuna varınca ekran kaybolur
			setTimeout(function () { yukleme.remove(); }, 700);
			const giris = function () {
				if (window.miniakentGirisAc) window.miniakentGirisAc();  // ardından hesap penceresi (kullanıcı, 2026-11-08)
			};
			// ilk açılışta önce tanıtım kartları şehrin üstünde, bitince giriş penceresi (kullanıcı, 2026-11-11)
			if (!(window.miniakentIlkTanitim && window.miniakentIlkTanitim(giris))) {
				giris();
			}
		});
	}
	// main.gd şehir ilk kez çizilince çağırır
	window.miniakentHazir = kapat;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		ilerle(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					ilerle(0.8 * current / total);  // indirme; kalan pay motorun açılışı ve şehrin kurulması
					if (current >= 0.97 * total) {  // son parça: motor birazdan açılır, sayfa betiği durabilir
						sonaDogru();
					}
				}
			},
		}).then(() => {
			sonaDogru();
			setTimeout(kapat, 15000);  // oyundan haber gelmezse de kalkar
		}, displayFailureNotice);
	}
}());
		</script>
