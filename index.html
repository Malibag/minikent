		<!--
		Miniakent yükleme ekranı (kullanıcı, 2026-10-20): Godot'un yükleme ekranı yerine logo ve kullanıcının
		tasarladığı ada çubuğu; ev, yükleme ilerledikçe sağa ilerler. Ziyaretçinin saatine göre 07:00–19:00
		gündüz, kalanı gece görseli. Çubuk parçaları ve logolar Web_Deneme'de (yukleme_*.webp). Oyun ilk kez
		çizilince (main.gd -> window.miniakentHazir) ekran kaybolur. Bu dosya export_presets.cfg'de
		html/custom_html_shell olarak verilir.

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #ffffff;
	overflow: hidden;
	touch-action: none;
}

body.gece {
	background-color: #121a2e;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#yukleme {
	position: absolute;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 3vh;
	background-color: inherit;
	transition: opacity 0.6s ease;
}

#yukleme.bitti {
	opacity: 0;
	pointer-events: none;
}

#yukleme-logo {
	width: min(72vw, 420px);
	max-height: 46vh;
	object-fit: contain;
}

#yukleme-cubuk {
	position: relative;
	width: min(88vw, 640px);
	aspect-ratio: 1275 / 174;
}

#yukleme-cubuk img {
	position: absolute;
	top: 0;
	height: 100%;
	pointer-events: none;
	user-select: none;
}

#cubuk-bos, #cubuk-dolu {
	left: 0;
	width: 100%;
}

/* Dolu kısım ve ev yalnız transform ile kayar: oyun motoru açılırken sayfa betiği dursa da tarayıcı bu
   hareketleri çizmeye devam eder (ev yolun ortasında takılmasın). */
#dolu-kap {
	position: absolute;
	inset: 0;
	overflow: hidden;
	transform: translateX(-100%);
	will-change: transform;
}

#cubuk-dolu {
	transform: translateX(100%);
	will-change: transform;
}

#cubuk-ev {
	position: absolute;
	top: 0;
	left: 0;
	width: 12.94%;
	height: 100%;
	will-change: transform;
}

#ev-resim {
	left: 0;
	width: 100%;
	animation: sallan 1.6s ease-in-out infinite;
}

@keyframes sallan {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-3%); }
}

#yukleme-yazi {
	position: absolute;
	bottom: 2.5vh;
	left: 0;
	right: 0;
	text-align: center;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 12px;
	letter-spacing: 0.02em;
	color: #a9a9a9;
}

body.gece #yukleme-yazi {
	color: #5f6b85;
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	z-index: 11;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}

(function () {
	// Gündüz mü gece mi: ziyaretçinin kendi saati (07:00–19:00 gündüz)
	const h = new Date().getHours();
	const zaman = (h >= 7 && h < 19) ? 'gunduz' : 'gece';
	if (zaman === 'gece') {
		document.body.classList.add('gece');
	}
	document.getElementById('yukleme-logo').src = 'yukleme_logo_' + zaman + '.webp';
	document.getElementById('cubuk-bos').src = 'yukleme_bos_' + zaman + '.webp';
	document.getElementById('cubuk-dolu').src = 'yukleme_dolu_' + zaman + '.webp';
	document.getElementById('ev-resim').src = 'yukleme_ev_' + zaman + '.webp';
}());

		<script type="module">
// Çevrimiçi ve günlük ziyaretçi (kullanıcı, 2026-10-25): Firebase Realtime Database (proje miniakent, europe-west1).
// Her ziyaretçi cevrimici/<kimlik> yazar, sekme kapanınca silinir; oyun sayıyı window.miniakentCevrimici'den okur.
// gunluk/<Türkiye tarihi> her tarayıcıda günde bir kez 1 artar. Bağlantı kurulamazsa oyun etkilenmez.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onDisconnect, onValue, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
try {
	const app = initializeApp({
		apiKey: "AIzaSyCC0HI_bln18UBMEDHdAO7CmtMEM3JtM5I",
		authDomain: "miniakent.firebaseapp.com",
		databaseURL: "https://miniakent-default-rtdb.europe-west1.firebasedatabase.app",
		projectId: "miniakent",
		appId: "1:591368262283:web:65292bb355bc8c55287a8e",
	});
	const db = getDatabase(app);
	const id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + "-" + Date.now();
	const ben = ref(db, "cevrimici/" + id);
	onValue(ref(db, ".info/connected"), (s) => {
		if (s.val() === true) {
			onDisconnect(ben).remove().then(() => set(ben, serverTimestamp()));
		}
	});
	onValue(ref(db, "cevrimici"), (s) => { window.miniakentCevrimici = s.size; });
	const gun = new Date(Date.now() + 3 * 3600 * 1000).toISOString().slice(0, 10);
	let sayildi = null;
	try { sayildi = localStorage.getItem("miniakent_gun"); } catch (e) {}
	if (sayildi !== gun) {
		runTransaction(ref(db, "gunluk/" + gun), (v) => (v || 0) + 1).then(() => {
			try { localStorage.setItem("miniakent_gun", gun); } catch (e) {}
		});
	}
	// Cadılar Bayramı kostümleri (kullanıcı, 2026-11-02): kartta seçilen kostüm <yol>/<kullanıcı adı> olarak yazılır,
	// herkes görür; sınır yok. Kullanıcı adında "@" atılır, "." yerine "," (Firebase anahtarında nokta olamaz).
	// Canlıda "kostum" bölümü yalnız Salı 3 Kasım 09:00 – Pazar 8 Kasım 06:00 arası açık (Türkiye saati; kullanıcı,
	// 2026-11-02): sayfa açıkken başlangıçta açılır, bitişte kostümler kalkar ve düğme kaybolur. Test sayfası kendi
	// yolunu verir (window.miniakentKostumYol = "kostum_deneme"), tarihsiz açıktır.
	const KOSTUM_BAS = Date.parse("2026-11-03T09:00:00+03:00");
	const KOSTUM_BIT = Date.parse("2026-11-08T06:00:00+03:00");
	let kostumBirak = null;
	const kostumAc = (yol) => {
		window.miniakentKostumlar = {};
		window.miniakentKostumSurum = (window.miniakentKostumSurum || 0) + 1;
		kostumBirak = onValue(ref(db, yol), (s) => {
			const o = {};
			s.forEach((c) => { o["@" + c.key.replace(/,/g, ".")] = c.val(); });
			window.miniakentKostumlar = o;
			window.miniakentKostumSurum++;
		});
		// boş ad = kostümü çıkar: kayıt silinir (kullanıcı, 2026-11-03)
		window.miniakentKostumSec = (h, ad) => set(ref(db, yol + "/" + h.replace(/^@/, "").replace(/\./g, ",")), ad || null);
	};
	const kostumKapat = () => {
		if (kostumBirak) kostumBirak();
		delete window.miniakentKostumSec;
		window.miniakentKostumlar = {};
		window.miniakentKostumSurum = (window.miniakentKostumSurum || 0) + 1;
	};
	if (window.miniakentKostumYol) {
		kostumAc(window.miniakentKostumYol);
		if (window.miniakentBeta) {  // betada da kostüm yalnız etkinlik süresince (kullanıcı, 2026-11-05)
			setTimeout(kostumKapat, Math.max(0, KOSTUM_BIT - Date.now()));
		}
	} else if (Date.now() < KOSTUM_BIT) {
		setTimeout(() => {
			kostumAc("kostum");
			setTimeout(kostumKapat, Math.max(0, KOSTUM_BIT - Date.now()));
		}, Math.max(0, KOSTUM_BAS - Date.now()));
	}
	// Kontrolü Al (kullanıcı, 2026-11-05; 1. adım: yalnız e-posta + şifreyle kayıt ve giriş, Instagram doğrulaması yok):
	// şimdilik yalnız deneme sayfasında (window.miniakentKontrolDeneme). Kartta "Kontrolü Al" pencereyi açar; girişten
	// sonra oyuncunun karakteri bu tarayıcıda saklanır (miniakent_karakter) ve kartında "Ayrıl" görünür. Oyun durumu
	// window.miniakentOturum'dan okur (JSON; boşsa giriş yok), her değişimde window.miniakentOturumSurum artar.
	if (window.miniakentKontrolDeneme) {
		const fa = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
		const auth = fa.getAuth(app);
		auth.languageCode = "tr";
		let karakter = "";
		try { karakter = localStorage.getItem("miniakent_karakter") || ""; } catch (e) {}
		const oturum = (u) => {
			window.miniakentOturum = u ? JSON.stringify({ eposta: u.email, dogrulandi: u.emailVerified, karakter: karakter }) : "";
			window.miniakentOturumSurum = (window.miniakentOturumSurum || 0) + 1;
		};
		fa.onAuthStateChanged(auth, oturum);
		const css = document.createElement("style");
		css.textContent = `
#kontrol { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
	background: rgba(20, 18, 15, 0.55); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
#kontrol[hidden], #kontrol [hidden] { display: none; }
#kontrol .kutu { position: relative; width: min(340px, calc(100vw - 32px)); box-sizing: border-box; padding: 22px 20px 18px;
	border-radius: 14px; background: #faf5eb; color: #2a2620; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
#kontrol h2 { margin: 0; font-size: 19px; text-align: center; }
#kontrol .kim { margin: 2px 0 14px; font-size: 14px; color: #776d60; text-align: center; }
#kontrol .kapat { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 24px; color: #776d60; cursor: pointer; }
#kontrol .sekme { display: flex; gap: 6px; margin-bottom: 14px; }
#kontrol .sekme button { flex: 1; padding: 8px; border: 1px solid #2a2620; border-radius: 10px; background: none; color: #2a2620; font-size: 14px; cursor: pointer; }
#kontrol .sekme button.secili { background: #2a2620; color: #faf5eb; }
#kontrol label { display: block; margin: 8px 0 4px; font-size: 13px; color: #776d60; }
#kontrol input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cfc5b4; border-radius: 10px; font-size: 16px; background: #fff; color: #2a2620; }
#kontrol .gonder { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 12px; background: #2a2620; color: #faf5eb; font-size: 15px; cursor: pointer; }
#kontrol .gonder:disabled { opacity: 0.6; }
#kontrol .unuttum { display: block; margin: 10px auto 0; border: 0; background: none; color: #776d60; font-size: 13px; text-decoration: underline; cursor: pointer; }
#kontrol .mesaj { min-height: 18px; margin-top: 10px; font-size: 13px; text-align: center; }
#kontrol .mesaj.hata { color: #b23b2e; }`;
		document.head.appendChild(css);
		const pen = document.createElement("div");
		pen.id = "kontrol";
		pen.hidden = true;
		pen.innerHTML = `<form class="kutu" novalidate>
	<button type="button" class="kapat" aria-label="Kapat">×</button>
	<h2>Kontrolü Al</h2>
	<div class="kim"></div>
	<div class="sekme"><button type="button" data-mod="kayit">Kayıt Ol</button><button type="button" data-mod="giris">Giriş Yap</button></div>
	<label for="kontrol-eposta">E-posta</label>
	<input id="kontrol-eposta" type="email" autocomplete="email" required>
	<label for="kontrol-sifre">Şifre</label>
	<input id="kontrol-sifre" type="password" required>
	<button type="submit" class="gonder"></button>
	<button type="button" class="unuttum">Şifremi unuttum</button>
	<div class="mesaj" role="status"></div>
</form>`;
		document.body.appendChild(pen);
		const q = (s) => pen.querySelector(s);
		const eposta = q("#kontrol-eposta");
		const sifre = q("#kontrol-sifre");
		const gonder = q(".gonder");
		const mesaj = q(".mesaj");
		let mod = "kayit";
		let aday = "";
		const yaz = (t, hata) => { mesaj.textContent = t; mesaj.classList.toggle("hata", !!hata); };
		const modSec = (m) => {
			mod = m;
			pen.querySelectorAll(".sekme button").forEach((b) => b.classList.toggle("secili", b.dataset.mod === m));
			gonder.textContent = m === "kayit" ? "Kayıt Ol" : "Giriş Yap";
			sifre.autocomplete = m === "kayit" ? "new-password" : "current-password";
			q(".unuttum").hidden = m === "kayit";
			yaz("");
		};
		const HATA = {
			"auth/invalid-credential": "E-posta ya da şifre yanlış.",
			"auth/wrong-password": "E-posta ya da şifre yanlış.",
			"auth/user-not-found": "E-posta ya da şifre yanlış.",
			"auth/email-already-in-use": "Bu e-postayla zaten bir hesap var.",
			"auth/weak-password": "Şifre en az 6 karakter olmalı.",
			"auth/invalid-email": "E-posta adresi geçersiz.",
			"auth/missing-password": "Şifreni yaz.",
			"auth/too-many-requests": "Çok fazla deneme yapıldı, biraz sonra tekrar dene.",
		};
		const hata = (e) => yaz(HATA[e && e.code] || "Bir sorun çıktı, tekrar dene.", true);
		const kapat = () => { pen.hidden = true; };
		pen.querySelectorAll(".sekme button").forEach((b) => b.addEventListener("click", () => modSec(b.dataset.mod)));
		q(".kapat").addEventListener("click", kapat);
		pen.addEventListener("click", (e) => { if (e.target === pen) kapat(); });
		q("form").addEventListener("submit", async (e) => {
			e.preventDefault();
			gonder.disabled = true;
			yaz("");
			try {
				const k = mod === "kayit"
					? await fa.createUserWithEmailAndPassword(auth, eposta.value.trim(), sifre.value)
					: await fa.signInWithEmailAndPassword(auth, eposta.value.trim(), sifre.value);
				karakter = aday;
				try { localStorage.setItem("miniakent_karakter", karakter); } catch (e2) {}
				oturum(k.user);
				if (mod === "kayit") {
					await fa.sendEmailVerification(k.user);
					yaz("Doğrulama bağlantısını e-postana gönderdik.");
				} else if (!k.user.emailVerified) {
					await fa.sendEmailVerification(k.user);  // doğrulanmamış girişte bağlantı yeniden gider (2026-11-05)
					yaz("E-postan henüz doğrulanmadı, yeni doğrulama bağlantısını gönderdik.");
				} else {
					kapat();
				}
			} catch (err) {
				hata(err);
			}
			gonder.disabled = false;
		});
		q(".unuttum").addEventListener("click", async () => {
			if (!eposta.value.trim()) {
				yaz("Önce e-postanı yaz.", true);
				return;
			}
			try {
				await fa.sendPasswordResetEmail(auth, eposta.value.trim());
				yaz("Şifre yenileme bağlantısını e-postana gönderdik.");
			} catch (err) {
				hata(err);
			}
		});
		window.miniakentKontrolAc = (h) => {
			aday = h;
			q(".kim").textContent = h;
			sifre.value = "";
			modSec("kayit");
			pen.hidden = false;
			eposta.focus();
		};
		window.miniakentAyril = () => {
			karakter = "";
			try { localStorage.removeItem("miniakent_karakter"); } catch (e) {}
			fa.signOut(auth);
		};
	}
} catch (e) {
	console.warn("Firebase", e);
}

	document.head.appendChild(font);
	const css = document.createElement("style");
	css.textContent = `

		});
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		ilerle(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					ilerle(0.8 * current / total);  // indirme; kalan pay motorun açılışı ve şehrin kurulması
					if (current >= 0.97 * total) {  // son parça: motor birazdan açılır, sayfa betiği durabilir
						sonaDogru();
					}
				}
			},
		}).then(() => {
			sonaDogru();
			setTimeout(kapat, 15000);  // oyundan haber gelmezse de kalkar
		}, displayFailureNotice);
	}
}());
		</script>
