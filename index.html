	// altına kadar görünür. İndirme sürerken her karede yerleştirilir; indirme bitince kalan yol tarayıcının
	// kendi animasyonuna verilir (motor açılırken sayfa betiği dursa da ev ilerlemeye devam eder).
	let hedef = 0;    // ulaşılması gereken ilerleme
	let gorunen = 0;  // ekrandaki ilerleme, hedefe yumuşakça yaklaşır
	let son = false;  // indirme bitti: hareket tarayıcı animasyonunda
	let anims = [];
	let bitti = false;

	function konum(g) {
		const w = cubuk.clientWidth;
		const x = 250 + g * 1200;
		const gizli = w - (x + 60) / 1700 * w;
		return [
			'translateX(' + (x / 1700 * w) + 'px)',
			'translateX(' + (-gizli) + 'px)',
			'translateX(' + gizli + 'px)',

		const b = konum(g1);
		const opt = { duration: ms, easing: 'cubic-bezier(0.25, 0.6, 0.35, 1)', fill: 'forwards' };

				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);

					ilerle(0.8 * current / total);  // indirme; kalan pay motorun açılışı ve şehrin kurulması
					if (current >= 0.97 * total) {  // son parça: motor birazdan açılır, sayfa betiği durabilir
						sonaDogru();

				}
			},
		}).then(() => {
			sonaDogru();
			setTimeout(kapat, 15000);  // oyundan haber gelmezse de kalkar
		}, displayFailureNotice);
	}
}());
