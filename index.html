		<!--
		Miniakent yükleme ekranı (kullanıcı, 2026-10-20): Godot'un yükleme ekranı yerine logo ve kullanıcının
		tasarladığı ada çubuğu; ev, yükleme ilerledikçe sağa ilerler. Ziyaretçinin saatine göre 07:00–19:00
		gündüz, kalanı gece görseli. Çubuk parçaları ve logolar Web_Deneme'de (yukleme_*.webp). Oyun ilk kez
		çizilince (main.gd -> window.miniakentHazir) ekran kaybolur. Bu dosya export_presets.cfg'de
		html/custom_html_shell olarak verilir.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #ffffff;
	overflow: hidden;
	touch-action: none;
}

body.gece {
	background-color: #121a2e;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#yukleme {
	position: absolute;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 3vh;
	background-color: inherit;
	transition: opacity 0.6s ease;
}

#yukleme.bitti {
	opacity: 0;
	pointer-events: none;
}

#yukleme-logo {
	width: min(72vw, 420px);
	max-height: 46vh;
	object-fit: contain;
}

#yukleme-cubuk {
	position: relative;
	width: min(88vw, 640px);
	aspect-ratio: 1275 / 174;
}

#yukleme-cubuk img {
	position: absolute;
	top: 0;
	height: 100%;
	pointer-events: none;
	user-select: none;
}

#cubuk-bos, #cubuk-dolu {
	left: 0;
	width: 100%;
}

/* Dolu kısım ve ev yalnız transform ile kayar: oyun motoru açılırken sayfa betiği dursa da tarayıcı bu
   hareketleri çizmeye devam eder (ev yolun ortasında takılmasın). */
#dolu-kap {
	position: absolute;
	inset: 0;
	overflow: hidden;
	transform: translateX(-100%);
	will-change: transform;
}

#cubuk-dolu {
	transform: translateX(100%);
	will-change: transform;
}

#cubuk-ev {
	position: absolute;
	top: 0;
	left: 0;
	width: 12.94%;
	height: 100%;
	will-change: transform;
}

#ev-resim {
	left: 0;
	width: 100%;
	animation: sallan 1.6s ease-in-out infinite;
}

@keyframes sallan {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-3%); }
}

#yukleme-yazi {
	position: absolute;
	bottom: 2.5vh;
	left: 0;
	right: 0;
	text-align: center;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 12px;
	letter-spacing: 0.02em;
	color: #a9a9a9;
}

body.gece #yukleme-yazi {
	color: #5f6b85;
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	z-index: 11;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}

			const b = document.createElement("button");
			b.type = "button";
			b.textContent = d[0];
			b.style.cssText = "border:0;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;background:" + d[2] + ";color:" + d[3];
			b.addEventListener("click", function () {
				try { localStorage.setItem("miniakent_cerez", d[1]); } catch (e) {}
				if (d[1] === "evet") {
					gtag("consent", "update", {analytics_storage: "granted"});

		});

(function () {
	// Gündüz mü gece mi: ziyaretçinin kendi saati (07:00–19:00 gündüz)
	const h = new Date().getHours();
	const zaman = (h >= 7 && h < 19) ? 'gunduz' : 'gece';
	if (zaman === 'gece') {
		document.body.classList.add('gece');
	}
	document.getElementById('yukleme-logo').src = 'yukleme_logo_' + zaman + '.webp';
	document.getElementById('cubuk-bos').src = 'yukleme_bos_' + zaman + '.webp';
	document.getElementById('cubuk-dolu').src = 'yukleme_dolu_' + zaman + '.webp';
	document.getElementById('ev-resim').src = 'yukleme_ev_' + zaman + '.webp';
}());

	// bina kartı (kullanıcı, 2026-11-06): bilgiler ve çalışanlar/yaşayanlar; ilk 12 ad, "Daha fazlasını gör" ile hepsi
	function binaGrup(tur) {
		const g = bina[tur], n = g.adlar.length, is = tur === "is";
		const adlar = binaTum[tur] ? g.adlar : g.adlar.slice(0, 12);

	const SAYFA = {
		kisi: ["Karakterim", () => {
			const is = isim(), ev = evim(), [dy, iste] = durumYazi(), k = kidem();
			return kart({ handle: karakter, meslek: is.meslek, yer: is.yer, ev: ev.adres, kira: ev.kira, ucret: is.ucret, para: st.para, g: ORNEK_G }, dy, iste) + `

		is: ["İş", () => {

			${uye.premium ? "" : `<p class="bilgi">Ev değiştirmek Premium üyelikle açılır.</p>`}
			<div class="bolum">Açık ilanlar</div>
			${l.length ? l.map((il) => ilanKutu(il, "ev")).join("") : `<div class="kutu bos"><p class="bilgi">Şu an açık ilan yok. İlanlar gün içinde farklı saatlerde çıkar.</p></div>`}`;
		}],
		// standart üyelikte yalnız zorunlular: yorgunsa eve, hastaysa hastaneye (kullanıcı, 2026-11-07); gerisi Premium
		ne: ["Ne yapsın?", () => {
			const [dy, iste] = durumYazi(), is = isim();
			const sart = { ev: ORNEK_G[0] >= 0.6 ? "" : "Yorgun olduğunda açılır", hastane: ORNEK_G[2] < 0.5 ? "" : "Hasta olduğunda açılır" };
			return `<span class="durum ${iste ? "" : "evde"}">Şu an: ${esc(dy.split(" · ")[0])}</span><div class="liste">
				${NE.map((n) => {

					return `<button class="git ${st.ne === n[0] ? "secili" : ""} ${kilit ? "kilitli" : ""}" data-ne="${n[0]}" ${kilit || kosul ? "disabled" : ""}><b>${n[1]}</b>
					<span>${kosul || n[2] || "Mesaiden sonra, saatlik " + Math.round(is.ucret * 1.5)}</span><em class="${kilit ? "kilit" : n[4] ? "iyi" : ""}">${kilit ? SVG.kilit + "Premium" : n[3]}</em></button>`;

		bina: [() => bina.baslik, () => `${bina.alt ? `<p class="bilgi">${esc(bina.alt)}</p>` : ""}${bina.is ? binaGrup("is") : ""}${bina.ev ? binaGrup("ev") : ""}`],
		// başka sakinin kartı: para ve göstergeler, Evini/İş yerini göster; kostüm yalnız etkinlik süresince (kullanıcı, 2026-11-05)
		sakin: ["Sakin", () => {
			const s = secilen, o = ozet(s.handle), m = mesai();

			<div class="ikili"><button class="hayir" data-evgoster="1">Evini göster</button>${s.is_var ? `<button class="hayir" data-isgoster="1">İş yerini göster</button>` : ""}</div>

			${kostumVar() ? (kostumAcik ? kostumIzgara(s.handle) : `<button class="git" data-kostumac="1"><b>Kostüm giydir</b><span>Cadılar Bayramı kostümleri</span><em>40 kostüm</em></button>`) : ""}`;
		}],
	};
	let secilen = null, kostumAcik = false, bina = null, binaTum = {};

	function ciz() {

		$("mkb-baslik").textContent = typeof s[0] === "function" ? s[0]() : s[0];

	// sekmeler panel açıkken panelin sağ kenarına yapışır; tam ekranda gizlenir. Kumanda panel tam ekranken gizli,
	// takip düğmeleri varken onların üstünde (kullanıcı, 2026-11-06)
	function arayuz() {
		const p = $("mkb-pano"), tam = p.classList.contains("tam");
		$("mkb-ray").hidden = !karakter || tam;
		$("mkb-ray").style.transform = sayfaAd ? `translateX(${p.offsetWidth - 3}px)` : "";
		for (const s of $("mkb-ray").children) s.setAttribute("aria-selected", String(s.dataset.ad === sayfaAd));
		$("mkb-a-kumanda").hidden = $("mkb-a-cizgi").hidden = !tel;

		if (window.miniakentArayuz) window.miniakentArayuz(tel && kumandaAcik && !tam, takipVar ? 84 : 0);
	}
	function ac(ad) {
		sayfaAd = ad; kostumAcik = false; binaTum = {};
		$("mkb-pano").classList.add("acik");

	function kapat() {   // panel kapanır; takip sürer (takibi "Takibi bırak" bitirir, kullanıcı 2026-11-06)
		sayfaAd = "";

		$("mkb-pano").setAttribute("aria-hidden", "true");
		arayuz();

	let cekildi = false;   // sekme çekerek açıldı: ardından gelen tıklama kapatmasın
	$("mkb-ray").addEventListener("click", (e) => {
		const s = e.target.closest(".sekme");

	$("mkb-kapat").addEventListener("click", kapat);
	$("mkb-buyut").addEventListener("click", () => { $("mkb-pano").classList.toggle("tam"); arayuz(); });
	$("mkb-ses").addEventListener("click", () => window.miniakentSes && window.miniakentSes());
	// parmakla: sekmeyi sağa çekince açılır, paneli sola çekince kapanır
	let x0 = null, cekilen = null;
	$("mkb-ray").addEventListener("pointerdown", (e) => { const s = e.target.closest(".sekme"); if (s) { x0 = e.clientX; cekilen = s.dataset.ad; } });
	$("mkb-pano").addEventListener("pointerdown", (e) => { if (!e.target.closest("button, input")) { x0 = e.clientX; cekilen = null; } });
	window.addEventListener("pointerup", (e) => {
		if (x0 === null) return;
		const dx = e.clientX - x0;
		x0 = null;
		if (cekilen && dx > 40 && sayfaAd !== cekilen) { ac(cekilen); cekildi = true; setTimeout(() => { cekildi = false; }, 400); }
		else if (!cekilen && dx < -40) kapat();
	});

	// Ayarlar (dişli): Kumanda, Ayrıl
	$("mkb-disli").addEventListener("click", () => {
		const acilsin = $("mkb-ayarlar").hidden;

	});
	$("mkb-ayril").addEventListener("click", () => {
		$("mkb-ayarlar").hidden = true;
		$("mkb-disli").setAttribute("aria-expanded", "false");

	});

	// takip düğmeleri
	$("mkb-goz").addEventListener("click", () => window.miniakentGoz && window.miniakentGoz());
	$("mkb-birak").addEventListener("click", () => window.miniakentBirak && window.miniakentBirak());

	$("mkb-icerik").addEventListener("click", (e) => {
		const b = e.target.closest("button");
		if (!b) return;
		const d = b.dataset;
		if (d.sec) window.minikentSearch && window.minikentSearch(d.sec);
		else if (d.hepsi) { binaTum[d.hepsi] = true; ciz(); }
		else if (d.takip) window.miniakentTakip && window.miniakentTakip(d.takip);
		else if (d.evgoster) window.miniakentEvGoster && window.miniakentEvGoster();
		else if (d.isgoster) window.miniakentIsGoster && window.miniakentIsGoster();
		else if (d.kontrol) window.miniakentKontrolAc && window.miniakentKontrolAc(secilen.handle);
		else if (d.kostumac) { kostumAcik = true; ciz(); }
		else if (b.id === "mkb-sifirla") { st = yeni(); kaydet(); ciz(); }

			setTimeout(ciz, 600);
		}
		else if (d.al || d.basvur) onay(d.al ? "al" : "basvur", d.al || d.basvur);
	});
	function onay(tur, id) {
		const il = IS_ILAN.concat(EV_ILAN).find((x) => x.id === id), fiyat = tur === "al" ? il.hemen : il.basvuru;
		bekleyen = { tur, il, fiyat };

		$("mkb-onay-yazi").textContent = st.para < fiyat ? "Paran yetmiyor. Paran: " + sayi(st.para)
			: tur === "basvur" ? sayi(fiyat) + " ödenecek. Kura ilan bitince çekilir. Seçilmezsen ücret geri ödenmez."
			: il.meslek ? sayi(fiyat) + " ödenecek. " + il.meslek + " işine hemen geçeceksin. 7 gün yeniden iş değiştiremezsin."
			: sayi(fiyat) + " ödenecek. " + il.adres + " hemen senin olur.";
		$("mkb-ode").disabled = st.para < fiyat;

	$("mkb-vazgec").addEventListener("click", () => { $("mkb-onay").hidden = true; });

	});

	// tanıtım (kullanıcı, 2026-11-07: "yeni olan her şeyi anlatacağız"): karakter bağlandığında bir kez
	const TANITIM = [
		["Karakterin artık senin", "Şehirde Instagram adınla yaşayan karakterin kontrolü artık sende. Sen oyunda olmasan da işine gider, evine döner."],
		["Mesai ve tatil", "Oyunda bir gün gerçekte bir saat sürer. Karakterin 4 saat çalışır, 1 saat öğle arası verir, 4 saat daha çalışır. 5 gün çalışır, 6. gün bütün şehir tatildedir."],
		["Kıdem ve ustalık", "Şehirde geçirdiğin her ay maaşına %2 kıdem eklenir, iş değiştirsen de kalır. Her gün oyuna girersen ustalığın artar; iş değiştirince ustalık sıfırlanır."],
		["Standart ve Premium", "Standart üyelikle iş ilanlarına başvurabilir, yorgunsan eve, hastaysan hastaneye gidebilirsin. Hemen Al, ev değiştirme, fazla mesai, kafe ve diğer yerler Premium üyelikle açılır."],
		["Para şimdilik örnek", "Para, maaş ve kira betada örnek rakamlarla görünür. Kurallar kesinleşince gerçek hesaplara geçilecek."],

	let tSira = 0;
	function tanitimCiz() {

		$("mkb-t-yazi").textContent = TANITIM[tSira][1];

		$("mkb-t-devam").textContent = tSira === TANITIM.length - 1 ? "Başla" : "Devam";
	}
	function tanitim(zorla) {

	}
	function tanitimBitir() {

	}
	$("mkb-t-gec").addEventListener("click", tanitimBitir);
	$("mkb-t-devam").addEventListener("click", () => { if (++tSira >= TANITIM.length) tanitimBitir(); else tanitimCiz(); });

	// arama ve öneriler (oyundaki kutunun yerine)
	const ara = $("mkb-ara"), oneri = $("mkb-oneri");

	const bolge = $("mkb-bolge");
	$("mkb-bolgeler").addEventListener("click", () => {

	// oyunun durumu: yarım saniyede bir (oyun açılınca ana ekran görünür)
	let sonBilgi = "", sonOturum = null, sonDk = -1, sonSecim = 0, sonBina = 0;
	setInterval(() => {

		if (window.miniakentSecimSurum && window.miniakentSecimSurum !== sonSecim) {

			if (yeniKarakter) tanitim(false);
