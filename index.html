		// kendi "Date" başlığıyla cihaz saati arasındaki fark (sn; 5 sn'den küçüğü yok sayılır). Oyun (main.gd _saat_esle)

			function esle() {
				var t0 = Date.now();
				fetch(location.href.split("#")[0], { method: "HEAD", cache: "no-store" }).then(function (r) {
					var s = Date.parse(r.headers.get("Date") || "");

					var f = (s + 500 - (t0 + Date.now()) / 2) / 1000;   // başlık saniyeye yuvarlı; isteğin ortası
					window.miniakentSaatFarki = Math.abs(f) < 5 ? 0 : f;
				}).catch(function () {});
			}
			esle();
			document.addEventListener("visibilitychange", function () { if (!document.hidden) esle(); });
		})();</script>

		const sifre2 = q("#kontrol-sifre2");

		const pencereSade = () => {

				? silYazi(false)
				: "Cinsiyet ve doğum tarihin silinecek. Emin misin?";

			pen.querySelectorAll(".sil-karakter").forEach((x) => { x.hidden = !(h && karakter); });
			q("#kontrol-karakter-sil").checked = false;
			q(".sil-onay").textContent = h ? "Hesabımı sil" : "Sil";
			sifre3.value = "";
			q(".giris").hidden = true;
			q(".sil").hidden = false;
			yaz("");
		};
		q(".profil-sil").addEventListener("click", () => window.miniakentSilAc("profil"));
		q(".silindi-tamam").addEventListener("click", kapat);
		q(".vazgec").addEventListener("click", () => { if (silTur === "profil") window.miniakentProfilAc(); else kapat(); });
		q(".sil-onay").addEventListener("click", async () => {

					const d = {};

					// "Karakterimi de şehirden çıkar": gece treni bu isteği okur, ad bu gece şehirden ayrılır ve geri
					// gelmez (cikarilanlar.txt); kural yalnız karakterin sahibine izin verir (kullanıcı, 2026-11-11)
					const cik = !!karakter && q("#kontrol-karakter-sil").checked;
					if (cik) d["cikis_istegi/" + anahtar(karakter)] = serverTimestamp();

		q(".unuttum").addEventListener("click", async () => {

				await fa.sendPasswordResetEmail(auth, eposta.value.trim());
				yaz("Şifre yenileme bağlantısını e-postana gönderdik.");
			} catch (err) {
				hata(err);
			}
		});
		// e-postası doğrulanmış oyuncu: karakteri bağlıysa pencere kapanır, değilse Instagram kodu gösterilir
		const baglan = async (u) => {
			q(".bekle").hidden = true;
			if ((await get(ref(db, "oyuncu/" + u.uid + "/karakter"))).val()) { kapat(); return; }
			const s = (await get(ref(db, "sahip/" + anahtar(aday)))).val();

			await u.getIdToken(true);  // e-posta doğrulaması veritabanı kurallarına da yansısın
			// aynı karakter için 23 saati dolmamış kod varsa o gösterilir; "Kontrolü Al"a yeniden basınca yeni kod çıkıp
			// gönderilen eski kod geçersiz olmasın (kullanıcı, 2026-11-12: "bazı kullanıcılar 2 kod atıyor")
			const eski = (await get(ref(db, "dogrulama/" + u.uid))).val();
			const kod = eski && eski.h === aday && typeof eski.t === "number" && Date.now() - eski.t < 23 * 3600 * 1000 ? eski.kod
				: String(100000 + crypto.getRandomValues(new Uint32Array(1))[0] % 900000);
			if (!eski || kod !== eski.kod) await set(ref(db, "dogrulama/" + u.uid), { h: aday, kod: kod, t: serverTimestamp() });
			q(".kod").textContent = kod;

			q(".dogrula").hidden = false;

				b.type = "button";
				b.textContent = h;
				oneri.appendChild(b);
			}
			oneri.hidden = !l.length;
		});
		oneri.addEventListener("click", (e) => {
			const b = e.target.closest("button");
			if (b) { ad.value = b.textContent; oneri.hidden = true; }
		});
		ad.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); q(".bul-git").click(); } });
		q(".bul-git").addEventListener("click", async () => {
			if (!sade(ad.value)) { yaz("Önce Instagram adını yaz.", true); return; }
			const h = (window.minikentHandles || []).find((x) => sade(x) === sade(ad.value));
			if (!h) { yaz("Bu ad şehirde yok. Takip ettikten sonraki ilk gece trenle şehre gelirsin.", true); return; }

			aday = h;

			q(".kim").textContent = h;
			q(".kim").hidden = false;
			q(".bul-git").disabled = true;
			try {
				await baglan(auth.currentUser);
			} catch (err) {
				hata(err);
			}
			q(".bul-git").disabled = false;
		});
		const dogrulandi = () => {
			if (pen.hidden || q(".dogrula").hidden) return;
			yaz("Doğrulandı. Karakterin artık senin.");
			setTimeout(kapat, 1500);
		};

		// bağlı değilse "Karakterini bul" adımı açılır (kullanıcı, 2026-11-08)
		const tamam = async (u) => {
			await u.getIdToken(true);
			oturum();

			bulGoster();
		};

		window.miniakentKontrolAc = async (h, kayit) => {

			q(".simdilik").hidden = !!aday;
			q(".dogrula").hidden = q(".bul").hidden = q(".bekle").hidden = q(".silindi").hidden = true;

			pen.hidden = false;

				eposta.value = u.email || "";
				try {
					await u.reload();
					if (u.emailVerified) await tamam(u);
					else dogrulamaBekle();
				} catch (err) {
					hata(err);
				}
				return;
			}
			if (aday) eposta.focus();
		};
		// e-postadaki doğrulama bağlantısı bu sayfayı açar (?mode=verifyEmail&oobCode=…; Firebase'de e-posta bağlantı adresi
		// bu sayfa, kullanıcı 2026-11-08): doğrulama burada yapılır, adres temizlenir. Şifre yenileme gibi öteki bağlantılar
		// Firebase'in kendi sayfasına gönderilir.
		const B = new URLSearchParams(location.search);
		let baglantiHata = false;
		const baglanti = (async () => {
			if (!B.get("mode") || !B.get("oobCode")) return;
			if (B.get("mode") !== "verifyEmail") {
				location.replace("https://miniakent.firebaseapp.com/__/auth/action" + location.search);
				return;
			}
			history.replaceState(null, "", location.pathname);
			try {
				await fa.applyActionCode(auth, B.get("oobCode"));
			} catch (err) {
				baglantiHata = err && err.code === "auth/expired-action-code";  // daha önce kullanılmışsa uyarı yok
			}
		})();
		// yükleme ekranı kalkınca: giriş yapmamışa hesap penceresi; doğrulanmış ama karakteri bağlı olmayana "Karakterini bul"
		window.miniakentGirisAc = async () => {
			await baglanti;
			await auth.authStateReady();
			const u = auth.currentUser;
			if (u) {
				try { await u.reload(); } catch (err) {}
				if (u.emailVerified && (await get(ref(db, "oyuncu/" + u.uid + "/karakter"))).val()) return;
			}
			window.miniakentKontrolAc("");
			if (baglantiHata && !(u && u.emailVerified)) {
				yaz("Bu doğrulama bağlantısının süresi dolmuş. Giriş yap, yeni bağlantı gönderelim.", true);
			}
		};
		window.miniakentAyril = () => fa.signOut(auth);
		// beta kartlarındaki tik: "lacivert" (Premium), "sari" (Instagram'la doğrulanmış) ya da ""
		window.miniakentRozet = async (h) => {
			const k = anahtar(h);
			const [s, p] = await Promise.all([get(ref(db, "sahip/" + k)), get(ref(db, "premium/" + k))]);
			return p.val() === true ? "lacivert" : s.exists() ? "sari" : "";
		};
	}
} catch (e) {
	console.warn("Firebase", e);
}

#mkb .para strong { font: 700 29px/1 var(--fb); font-variant-numeric: tabular-nums; }
#mkb .bugun { text-align: right; font-size: 11px; line-height: 1.45; font-variant-numeric: tabular-nums; }
#mkb .arti { color: var(--arti); font-weight: 800; }
#mkb .eksi { color: var(--kiremit); font-weight: 800; }
#mkb .gosterge { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 4px 10px; font-weight: 700; font-size: 11.5px; }
#mkb .gosterge.tek { grid-template-columns: 1fr; }
#mkb .ada { height: 16px; border-radius: 9px; background: var(--kum); border-bottom: 4px solid var(--deniz); overflow: hidden; }
#mkb .ada i { display: block; height: 100%; background: var(--cimen); border-radius: 9px 4px 4px 9px; }
#mkb .kucuk { font-size: 10px; color: var(--soluk); font-weight: 600; }
#mkb .gosterge .kucuk { grid-column: 2; }
#mkb .gosterge.tek .kucuk { grid-column: 1; }
#mkb .alt-dugmeler { display: flex; justify-content: center; gap: 16px; }
#mkb .bag { border: 0; background: none; color: var(--soluk); font-weight: 700; text-decoration: underline; padding: 6px; }
#mkb .satir { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
#mkb .satir span { color: var(--soluk); }
#mkb .satir b { font-variant-numeric: tabular-nums; text-align: right; }
#mkb .kutu h3 { margin: 0; font: 600 15.5px var(--fb); }
#mkb .kutu .alt { margin: -6px 0 0; color: var(--soluk); font-size: 11px; }
#mkb .bilgi { margin: 0; font-size: 11px; line-height: 1.45; color: var(--soluk); }
#mkb .bolum { margin: 6px 0 -4px; font: 600 13.5px var(--fb); }
#mkb .ilan { border-color: var(--kiremit); }
/* Test802 (2026-11-20): "Doktor · Geçici" gri, "Doktor · Kadrolu" yeşil; başlangıç ilanları, uzmanlık, kurs */
#mkb .kd { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--kum); color: #162132; font: 800 10.5px var(--fg); font-style: normal; }
#mkb .kd.kadrolu { background: #2fa35a; color: #fff; }
#mkb .i8 { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 2px solid var(--kenar); border-radius: 14px; background: var(--krem2); }
#mkb .i8 b { font: 600 14px var(--fb); }
#mkb .i8 small { grid-column: 1; color: var(--soluk); font-size: 10.5px; font-weight: 700; }
#mkb .i8 button { grid-column: 2; grid-row: 1 / span 2; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--kenar); background: var(--deniz); color: #fff6e4; font-weight: 800; font-size: 11.5px; box-shadow: 0 3px 0 var(--golge); }
#mkb .i8 button:disabled { background: var(--kum); color: #5d6680; box-shadow: none; cursor: default; }
#mkb .i8.secili { border-color: #2fa35a; }
#mkb .kadro { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding-top: 10px; border-top: 2px dashed var(--kum); }
#mkb .kadro b { font-size: 12px; }
#mkb .kadro p { grid-column: 1; margin: 0; font-size: 10.5px; color: var(--soluk); line-height: 1.4; }
#mkb .kadro .fiyat { grid-column: 1; font: 600 13px var(--fb); font-variant-numeric: tabular-nums; }
#mkb .kadro button { grid-column: 2; grid-row: 1 / span 3; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--kenar); font-weight: 800; font-size: 12px; color: #fff6e4; box-shadow: 0 3px 0 var(--golge); }
#mkb .hemen { background: var(--kiremit); }
#mkb .basvur { background: var(--deniz); }
#mkb .kadro button:disabled { background: var(--kum); color: #5d6680; box-shadow: none; cursor: default; }
#mkb .bos { text-align: center; padding: 18px 14px; border-style: dashed; }
#mkb .liste { display: flex; flex-direction: column; gap: 8px; }
#mkb .git { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 12px; border-radius: 14px; border: 2px solid var(--kenar); background: var(--krem2); text-align: left; }
#mkb .git b { font: 600 13.5px var(--fb); }
#mkb .git span { grid-column: 1; font-size: 10.5px; color: var(--soluk); }
#mkb .git em { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-style: normal; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--kum); color: #162132; }
#mkb .git em.iyi { background: var(--cimen); }
#mkb .git.secili { border-color: var(--deniz); box-shadow: inset 0 0 0 2px var(--deniz); }
#mkb .git:disabled { opacity: .55; cursor: default; }
/* Premium'da açılan her şey (kullanıcı, 2026-11-07): görünür ama soluk, kesik kenarlı, kilitli rozetle */
#mkb .git.kilitli { border-style: dashed; }
#mkb .git em.kilit, #mkb .kadro button.kilit:disabled { display: inline-flex; align-items: center; gap: 4px; background: var(--yazi); color: var(--krem2); opacity: .8; }
#mkb .kadro button.kilit:disabled { border-style: dashed; }
#mkb .kilit svg { width: 12px; height: 12px; flex: 0 0 auto; }
/* tik: Instagram onaylı sarı, Premium lacivert (kullanıcı, 2026-11-07) */
#mkb .tik { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 5px; border-radius: 50%; vertical-align: -2px; }
#mkb .tik svg { width: 11px; height: 11px; }
#mkb .tik.sari { background: #f2c230; color: #162132; }
#mkb .tik.lacivert { background: #162132; color: #fbe9cb; box-shadow: 0 0 0 1.5px #fbe9cb; }
/* tanıtım: karakter ilk bağlandığında bir kez */
#mkb .tanitim { position: absolute; inset: 0; z-index: 11; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(11,18,32,.55); pointer-events: auto; }
#mkb .tanitim .kutu { width: min(100%, 420px); box-shadow: 0 4px 0 var(--golge); }
#mkb .tanitim h3 { font-size: 18px; }
#mkb .tanitim p { margin: 0; font-size: 13px; line-height: 1.5; }
#mkb .tanitim .noktalar { display: flex; justify-content: center; gap: 6px; }
#mkb .tanitim .noktalar i { width: 8px; height: 8px; border-radius: 50%; background: var(--kum); }
#mkb .tanitim .noktalar i.bu { background: var(--yazi); }
#mkb .sekmeler { display: flex; gap: 4px; }
#mkb .sekmeler button { flex: 1; padding: 7px 4px; border-radius: 10px; border: 2px solid var(--kenar); background: transparent; font-weight: 800; font-size: 11px; }
#mkb .sekmeler button.secili { background: var(--yazi); color: var(--krem2); }
#mkb .kiy-sekmeler { flex-wrap: wrap; }
#mkb .kiy-sekmeler button { flex: 1 0 auto; }
#mkb .kiyafet { display: flex; flex-direction: column; gap: 6px; }
#mkb .kiy-grup { margin-top: 6px; font-size: 10px; font-weight: 800; color: var(--soluk); }
#mkb .kiy-satir { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 7px; border-radius: 10px; border: 2px solid transparent; background: var(--krem2); }
#mkb .kiy-satir.secili { border-color: var(--deniz); }
#mkb .kiy-satir span { min-width: 0; font-weight: 700; font-size: 11px; line-height: 1.25; }
/* renk noktaları satıra sığar, sağa taşmaz (kullanıcı, 2026-11-11) */
#mkb .renkler { display: flex; gap: 4px; flex-shrink: 0; }
#mkb .renkler button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(22,33,50,.35); padding: 0; }
#mkb .renkler button.secili { outline: 2px solid var(--deniz); outline-offset: 1px; }
#mkb .kiy-yok { align-self: flex-start; padding: 7px 16px; border-radius: 10px; border: 2px solid var(--kenar); background: transparent; font-weight: 800; }
#mkb .kiy-yok.secili { background: var(--yazi); color: var(--krem2); }
#mkb .kostumler { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
#mkb .kostumler button { aspect-ratio: 4 / 5; border-radius: 10px; border: 2px solid transparent; background: url("beta/kostumler.png") 0 0 / 500% 800% no-repeat, var(--krem2); padding: 0; }
#mkb .kostumler button.secili { border-color: var(--deniz); }
#mkb .devam { align-self: flex-start; border: 0; background: none; padding: 2px 0; font-weight: 800; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
#mkb .adlar { display: flex; flex-wrap: wrap; gap: 6px; }
#mkb .adlar button { padding: 5px 10px; border-radius: 999px; border: 2px solid var(--kenar); background: var(--krem2); font-weight: 700; font-size: 11px; }
/* ayarlar: dişliden açılır */
/* 2026-11-16 (kullanıcı): "Şu an şehirde" gibi sağdan kayan panel; üst şeridin altından arama satırının üstüne */
#mkb .ayarlar { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px));
	width: min(85%, 300px); z-index: 9; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--krem);
	border: 3px solid var(--kenar); border-right: 0; border-radius: 24px 0 0 24px; box-shadow: 0 4px 0 var(--golge);
	transform: translateX(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
#mkb .ayarlar.acik { transform: none; }
#mkb .ayarlar > * { flex-shrink: 0; }
#mkb .ayarlar .p-bas { display: flex; align-items: center; margin-right: -8px; }
#mkb .ayarlar .p-bas h2 { flex: 1; }
#mkb .ayarlar h2 { margin: 0; font: 700 16px var(--fb); }
#mkb .anahtar { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; border: 0; background: none; padding: 0; }
#mkb .anahtar b { font: 600 13.5px var(--fb); }
#mkb .anahtar small { grid-column: 1; color: var(--soluk); font-size: 10px; line-height: 1.35; }
#mkb .anahtar i { grid-column: 2; grid-row: 1 / span 2; position: relative; width: 50px; height: 28px; border-radius: 999px; background: var(--kum); border: 2px solid var(--kenar); transition: background .2s; }
#mkb .anahtar i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--krem2); border: 2px solid var(--kenar); transition: left .2s; }
#mkb .anahtar[aria-checked="true"] i { background: var(--cimen); }
#mkb .anahtar[aria-checked="true"] i::after { left: 24px; }
#mkb .anahtar:disabled { opacity: .5; cursor: default; }
#mkb .ayarlar hr { border: 0; border-top: 2px dashed var(--kum); margin: 0; }
#mkb .profil { display: flex; flex-direction: column; gap: 2px; }
#mkb .profil b { font: 600 13.5px var(--fb); overflow-wrap: anywhere; }
#mkb .profil small { color: var(--soluk); font-size: 11px; font-weight: 700; }
/* profil bilgileri, izinler ve silme (kullanıcı, 2026-11-09); menü uzunsa kendi içinde kayar */
#mkb .ayarlar { max-height: calc(100dvh - 80px - env(safe-area-inset-top, 0px)); overflow-y: auto; box-sizing: border-box; }
#mkb .p-ayar { display: flex; flex-direction: column; gap: 12px; }
#mkb .p-izin { display: flex; flex-direction: column; gap: 12px; }
#mkb .tercih { max-height: 80vh; overflow-y: auto; }
#mkb .tercih > *, #mkb .tr-grup > * { flex-shrink: 0; }
#mkb .tr-satir > span { flex: 1; min-width: 0; }
#mkb .tr-grup { display: flex; flex-direction: column; gap: 10px; }
#mkb .tr-satir { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
#mkb .tr-satir input { width: 18px; height: 18px; flex: none; margin: 1px 0 0; accent-color: var(--deniz); }
#mkb .tr-satir b { display: block; font: 600 13.5px var(--fb); }
#mkb .tr-satir small { display: block; color: var(--soluk); font-size: 11px; line-height: 1.35; }
#mkb .tercih .grup, #mkb .ayarlar .grup { margin-bottom: -4px; color: var(--soluk); font: 800 10px var(--fb); letter-spacing: .03em; text-transform: uppercase; }
#mkb .p-dugme { align-self: flex-start; border: 0; background: none; padding: 0; color: inherit; font: 600 13px var(--fb); text-decoration: underline; text-underline-offset: 3px; text-align: left; }
#mkb .p-dugme.kirmizi { color: #b23b2e; }
#mkb .ayril { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--kenar); background: transparent; }
#mkb .ayril b { font: 600 13.5px var(--fb); }
#mkb .ayril small { color: var(--soluk); font-size: 10px; }
/* takip: bir kişi takip edilirken altta ortada */
#mkb .takip { position: absolute; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6;
	display: flex; flex-direction: column; align-items: center; gap: 6px; }
#mkb .takip .kim-ad { padding: 3px 10px; border-radius: 999px; background: var(--yazi); color: var(--krem2); font-weight: 800; font-size: 10.5px; white-space: nowrap; }
#mkb .takip .dugmeler { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--krem); border: 2.5px solid var(--kenar); box-shadow: 0 3px 0 var(--golge); }
#mkb .takip button { padding: 8px 14px; border-radius: 999px; border: 0; background: transparent; font-weight: 800; font-size: 11.5px; white-space: nowrap; }
#mkb .takip button.koyu { background: var(--yazi); color: var(--krem2); }
#mkb .mkb-onay { position: absolute; inset: 0; z-index: 10; background: rgba(11,18,32,.5); display: flex; align-items: flex-end; justify-content: center; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
#mkb .mkb-onay .kutu { width: min(100%, 520px); box-shadow: 0 4px 0 var(--golge); }
#mkb .mkb-onay p { margin: 0; line-height: 1.45; font-size: 12px; }
#mkb .ikili { display: flex; gap: 8px; }
#mkb .ikili button { flex: 1; padding: 11px; border-radius: 12px; border: 2px solid var(--kenar); font-weight: 800; }
#mkb .ikili .evet { background: var(--yazi); color: var(--krem2); }
#mkb .ikili .evet:disabled { opacity: .45; }
#mkb .ikili .hayir { background: transparent; }
body.gece #mkb .ikili .hayir, body.gece #mkb .sekmeler button { border-color: var(--yazi); }
#mkb .tost { position: absolute; left: 50%; top: calc(110px + env(safe-area-inset-top, 0px)); z-index: 10; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px;
	background: var(--yazi); color: var(--krem2); font-size: 11px; font-weight: 700; white-space: nowrap; }
/* yeni Karakterim düzeni (kullanıcı, 2026-11-17; yalnız test sayfası, #mkb.yeni): üstte sabit profil, altta küçük simgeli
   menü (Görünüş, Finans, İlanlar); soldaki büyük sekmeler yerine küçük bir açma düğmesi */
#mkb.yeni .sekme[data-ad="gorunus"], #mkb.yeni .sekme .avatar { display: none; }
#mkb.yeni .sekme { padding: 3px 5px 3px 3px; }
#mkb.yeni .sekme .simge.kucuk { width: 26px; height: 26px; }
#mkb.yeni .sekme .simge.kucuk svg { width: 17px; height: 17px; }
#mkb.yeni .mkb-pano { height: calc(100% - 150px - 76px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }   /* arama çubuğuna kadar */
#mkb .amenu { position: sticky; bottom: -16px; z-index: 2; margin-top: auto; display: flex; justify-content: space-around; background: var(--krem);
	border-top: 2px solid var(--kenar); padding: 6px 0 8px; }
#mkb .amenu button { display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 11px; background: none; border: 0;
	color: var(--yazi); opacity: .6; padding: 2px 10px; }
#mkb .amenu button[aria-selected="true"] { opacity: 1; font-weight: 700; }
/* Durum ve Etkinlikler (kullanıcı, 2026-11-17; test sayfası): menünün altında tek, geniş Etkinlikler düğmesi; iki uçlu terazi çubuklar */
#mkb .amenu { flex-wrap: wrap; row-gap: 6px; }
#mkb .amenu .etk { flex-basis: 100%; flex-direction: row; justify-content: center; margin: 0 10px; padding: 9px; border-radius: 12px;
	border: 2px solid var(--kenar); background: var(--yazi); color: var(--krem2); font-size: 13px; font-weight: 800; opacity: 1; }
#mkb .tbar { margin: 14px 0 18px; }
#mkb .tbar .tb-ad { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--soluk); }
#mkb .tbar .tb-ad b { color: var(--yazi); font-size: 13px; }
#mkb .tbar .iz { position: relative; height: 14px; margin-top: 22px; border-radius: 999px; background: var(--krem2); border: 2px solid var(--kenar); }
#mkb .tbar .orta { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--kenar); }
#mkb .tbar .dolu { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
#mkb .tbar .dolu.iyi { background: #2fa35a; }
#mkb .tbar .dolu.kotu { background: #d8433b; }
#mkb .tbar .deger { position: absolute; top: -20px; transform: translateX(-50%); font-style: normal; font-size: 11px; font-weight: 800; }
#mkb.yeni.takipli .mkb-pano { height: calc(100% - 150px - 76px - 84px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }   /* takip çubuğu (Hızlı yürü) Etkinlikler düğmesinin üstüne binmesin */
#mkb .ikili button:disabled { opacity: .45; }
#mkb .etk-yer small { color: var(--soluk); font-weight: 400; }
/* sade kart (kullanıcı, 2026-11-17: "tuşlar çok büyük", "yazıların yanında çok boşluk"): küçük menü, tek satırlık etkinlikler */
#mkb .amenu { padding: 4px 0 6px; }
#mkb .amenu button { font-size: 10px; padding: 1px 6px; gap: 1px; }
#mkb .amenu svg { width: 16px; height: 16px; }
#mkb .amenu .etk { padding: 6px; margin: 0 8px; font-size: 12px; }
#mkb .etk-l { display: flex; flex-direction: column; gap: 5px; }
#mkb .etk-s { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 9px; border: 2px solid var(--kenar); border-radius: 11px; background: var(--krem2); }
#mkb .etk-s .ad { flex: 1; min-width: 0; font-size: 11.5px; font-weight: 800; line-height: 1.2; }
#mkb .etk-s .ad small { display: block; margin-top: 1px; font-size: 9.5px; font-weight: 400; color: var(--soluk); }
#mkb .etk-s .fiyat { font-size: 10.5px; font-weight: 800; white-space: nowrap; }
#mkb .etk-s button, #mkb .kucuk-d { font: inherit; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; border: 2px solid var(--kenar);
	background: transparent; color: var(--yazi); white-space: nowrap; }
#mkb .etk-s button.koyu { background: var(--yazi); color: var(--krem2); }
#mkb .etk-s button:disabled, #mkb .kucuk-d:disabled { opacity: .4; }
#mkb .etk-ust { display: flex; flex-direction: column; align-items: flex-end; gap: 16px; }
#mkb .takip .kim-ad { cursor: pointer; }
/* şehir sohbeti (kullanıcı, 2026-11-18): arama satırındaki düğmeyle alttan açılır; bilgisayarda sağda 9:16 ince uzun, telefonda ekranı kaplar; gece de bej */
#mkb .sohbet-ekran { position: absolute; top: 0; bottom: 0; right: 0; width: min(100%, calc(100dvh * 9 / 16)); border-left: 2px solid #162132; z-index: 20; display: flex; flex-direction: column; background: #fbe9cb; color: #162132; color-scheme: light;
	padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); pointer-events: auto; transform: translateY(100%); visibility: hidden;
	transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; }
#mkb .sohbet-ekran.acik { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
#mkb .s-bas { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 16px; border-bottom: 2px solid #162132; }
#mkb .s-bas h2 { flex: 1; margin: 0; font: 700 16px var(--fb); }
#mkb .s-kapat { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 2px solid #162132; background: #fff6e4; color: #162132; }
#mkb .s-kapat svg { width: 16px; height: 16px; }
#mkb .s-liste { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px; }
#mkb .s-bos { margin: auto; color: #5d6680; font-size: 12px; text-align: center; }
#mkb .s-b { align-self: flex-start; max-width: 80%; padding: 6px 10px 4px; border-radius: 14px 14px 14px 4px; background: #fff6e4; border: 1.5px solid #162132;
	font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
#mkb .s-ad { display: block; font-weight: 800; font-size: 12.5px; margin-bottom: 1px; }
#mkb .s-b.ben { align-self: flex-end; background: #162132; color: #fbe9cb; border-radius: 14px 14px 4px 14px; }

	document.body.appendChild(kok);

	// Mesai oyun saatiyle (clock.gd: 1 oyun günü = 1 gerçek saat, şehrin kuruluşu 17 Ekim 2026 00:00 UTC). Betada 6 saat
	// iş, öğle arası yok; başlangıç kişiye göre 08:00, 09:00 ya da 10:00 (kullanıcı, 2026-11-15; clock.gd mesai ile
	// aynı); 6 günde bir herkes tatilde (2026-11-07). Başkasının kartında saat yazılmaz (gizli), durum onun saatiyle.
	const MESAI_SURE = 6;
	// Zaman düzeni (kullanıcı, 2026-11-19; clock.gd DENEY ile aynı): uyku 00–06 ve iş 08–14 2 kat hızlı (7,5 dk), sabah ve
	// eğlence 45 dk. [saat içindeki gerçek sn, oyun saati]
	const DENEY = [[0, 0], [450, 6], [900, 8], [1350, 14], [3600, 24]];
	const oyunSaat = () => {
		const sn = (miniakentSimdi() - Date.UTC(2026, 9, 17)) / 1000 % 3600;
		for (let i = 0; i < DENEY.length - 1; i++)
			if (sn < DENEY[i + 1][0] || i === DENEY.length - 2)
				return DENEY[i][1] + (sn - DENEY[i][0]) / (DENEY[i + 1][0] - DENEY[i][0]) * (DENEY[i + 1][1] - DENEY[i][1]);
	};
	const saatYaz = (h) => String(Math.floor(h)).padStart(2, "0") + ":" + String(Math.round(h % 1 * 60)).padStart(2, "0");
	// Takvim (kullanıcı, 2026-11-15; uygulamada ana_ekran.gd _takvim): 1 oyun ayı = 1 gerçek gün, Türkiye saatiyle
	// 12:00'de başlar; 1 oyun yılı = 1 takvim ayı (Ekim 2026 = 1. yıl). Saat oyunun kendi saati (hud.saat'in sonu).
	function takvim(saat) {
		const d = new Date(miniakentSimdi() - 9 * 3600e3);
		const yil = (d.getUTCFullYear() - 2026) * 12 + d.getUTCMonth() + 1 - 9;
		return yil + ". Yıl " + d.getUTCDate() + ". Ay\nGün: " + (d.getUTCHours() + 1) + " · " + String(saat || "").split(" · ").pop();
	}
	function mesai(bas, gizli) {
		const h = oyunSaat(), b = bas || 9, tatil = !!(window.miniakentHud && window.miniakentHud.tatil);
		const iste = !tatil && h >= b && h < b + MESAI_SURE;
		return { iste, tatil, ara: false, aralik: saatYaz(b) + "–" + saatYaz(b + MESAI_SURE), oran: tatil ? 0 : Math.max(0, Math.min(1, (h - b) / MESAI_SURE)),
			yazi: tatil ? "Bugün tatil" : !bas || gizli ? "6 saat iş" : saatYaz(b) + "–" + saatYaz(b + MESAI_SURE) };
	}
	function durumYazi() {
		const ne = NE.find((n) => n[0] === st.ne);
		if (ne) return [ne[5], ne[0] === "mesai"];
		const m = mesai(bilgi && bilgi.mesai);
		return m.tatil ? ["Tatilde", false] : m.ara ? ["Öğle arasında", false] : m.iste ? ["İşte · " + m.aralik, true] : ["Evde", false];
	}
	// kıdem: şehre gelişten bu yana her 720 oyun gününde (gerçekte 30 gün) %2, tavan yok; ustalık: oyuna girilen her gün
	// %0,2, en çok %20 (kullanıcı, 2026-11-07)
	function kidem() {
		if (!bilgi || !bilgi.gelis) return null;
		const adim = Math.max(0, Math.floor((miniakentSimdi() / 1000 - bilgi.gelis) / 3600 / 720));
		return { oran: adim * 2, sonraki: new Date((bilgi.gelis + (adim + 1) * 720 * 3600) * 1000).toLocaleDateString("tr-TR", { day: "numeric", month: "long" }) };
	}
	const yuzde = (x) => "%" + x.toLocaleString("tr-TR", { maximumFractionDigits: 1 });
	// adın yanındaki tik: Instagram'la doğrulanmış sarı, Premium lacivert; başkalarınınki Firebase'den bir kez sorulur
	const rozetler = {};
	function rozet(h) {
		// başlangıç sürümü (kullanıcı, 2026-11-09): Premium yok, doğrulanmış herkes sarı tik
		return h === karakter || rozetler[h] ? `<i class="tik sari" title="Instagram onaylı">${SVG.tik}</i>` : "";
	}
	function rozetGetir(h) {
		if (h in rozetler || typeof window.miniakentRozet !== "function") return;
		rozetler[h] = "";
		window.miniakentRozet(h).then((r) => { rozetler[h] = r; if (r && sayfaAd) ciz(); }).catch(() => {});
	}
	const ORNEK_G = [.62, .35, .9];   // örnek göstergeler: yorgunluk, stres, sağlık
	const ada = (oran) => `<div class="ada"><i style="width:${Math.round(Math.max(0, Math.min(1, oran)) * 100)}%"></i></div>`;

	function ilanKutu(il, tur) {
		const k = kalan(il), alindi = il.dolu || st.alinan[il.id], basvurdu = st.basvuru[il.id];
		const kilit = tur === "is" && isBekleme();
		// standart üyelik (kullanıcı, 2026-11-07): ilana yalnız başvurur, Hemen Al ve ev değiştirme Premium'da
		const pAl = !uye.premium, pBas = !uye.premium && tur === "ev";
		const bas = tur === "is" ? `<h3>${esc(il.meslek)}</h3><p class="alt">${esc(il.yer)}</p>
			<div class="satir"><span>Meslek grubu</span><b>${esc(il.grup)} · saatlik ${il.ucret}</b></div>`
			: `<h3>${esc(il.adres)}</h3><div class="satir"><span>Günlük kira</span><b>${il.kira}</b></div>`;
		return `<div class="kutu ilan"><span class="ornek">Örnek</span>${bas}

	}

	// Kişi kartının üst kısmı (kullanıcı, 2026-11-05: başkasının kartı da kendi kartı gibi, yalnız seçmeli menüler yok).
	// İsme dokununca kamera o kişiyi takip eder.
	function kart(k, dy, iste) {
		const m = k.handle === karakter && bilgi ? mesai(bilgi.mesai)
			: mesai(secilen && secilen.handle === k.handle ? secilen.bas : null, true);
		return `<button class="kim" data-takip="${esc(k.handle)}" style="border:0;background:none;padding:0;text-align:left">

				<b>${esc(k.handle)}${rozet(k.handle)}</b><span>${T8 ? meslekCip(k.handle, k.meslek) : esc(k.meslek)}${k.yer && !kadrosu(k.handle) ? " · " + esc(k.yer.split(" · ")[0]) : ""}</span><span>${esc(k.ev)}</span></div></button>
			<span class="durum ${iste ? "" : "evde"}">${esc(dy)}</span>
			<div class="kutu"><div class="gosterge"><span>Mesai</span>${ada(m.oran)}<span class="kucuk">${m.yazi}</span></div></div>`;

	// başka sakinin örnek parası ve göstergeleri: kullanıcı adından (her açılışta aynı)
	function ozet(h) {
		let x = 7;
		for (const c of h) x = (x * 31 + c.charCodeAt(0)) >>> 0;
		return { para: 3000 + x % 17000, g: [((x >> 3) % 70 + 20) / 100, ((x >> 7) % 70 + 15) / 100, ((x >> 11) % 40 + 60) / 100] };
	}
	// kıyafet seçimi (kullanıcı, 2026-11-09; onaylı liste): alt tek (pantolon/etek/şort), palto ya da mont en çok bir,
	// şapka isteğe bağlı, ayakkabı bir, aksesuarlar birlikte (iki gözlük birden olmaz); her parçada 6 renk
	const SAC_RENKLER = [["Siyah", "#1f1a17"], ["Kahverengi", "#5a3a26"], ["Kumral", "#8b6a43"], ["Sarı", "#e3c16f"], ["Kızıl", "#b4471f"], ["Beyaz", "#e8e6e1"]];
	// [sekme, anahtar, isteğe bağlı mı (Yok ve yeniden dokununca çıkarma), [[grup, parçalar, grup anahtarı]], renkler]
	// (kullanıcı, 2026-11-10: Saç Modeli, Üst + Tek parça, Sakal Bıyık); sakal "k", bıyık "b" birlikte seçilebilir
	const KIY = [
		["Saç Modeli", "h", false, [["", [["kisa", "Kısa"], ["uzun", "Uzun"], ["topuz", "Topuz"], ["kivircik", "Kıvırcık"], ["atkuyrugu", "At kuyruğu"], ["orgu", "Örgü"], ["kakullu", "Kâküllü"], ["dazlak", "Dazlak"]]]], SAC_RENKLER],
		["Sakal Bıyık", "k", true, [["Sakal", [["kirli", "Kirli sakal"], ["keci", "Keçi sakalı"], ["kisa", "Kısa sakal"], ["uzun", "Uzun sakal"]]],
			["Bıyık", [["duz", "Düz bıyık"], ["pala", "Pala bıyık"], ["ince", "İnce bıyık"]], "b"]], SAC_RENKLER],
		["Üst", "u", false, [["", [["tisort", "Tişört"], ["uzunkol", "Uzun kollu tişört"], ["polo", "Polo tişört"], ["gomlek", "Gömlek"], ["bluz", "Bluz"], ["kazak", "Kazak"], ["balikci", "Balıkçı yaka kazak"], ["kapusonlu", "Kapüşonlu sweatshirt"], ["atlet", "Atlet"]]],
			["Tek parça", [["kisaelbise", "Kısa elbise"], ["uzunelbise", "Uzun elbise"], ["tulum", "Tulum"]]]]],
		["Alt", "a", false, [["Pantolon", [["duz", "Düz pantolon"], ["kot", "Kot pantolon"], ["esofman", "Eşofman altı"], ["genis", "Geniş paça"], ["dar", "Dar pantolon"]]],

		["Şapka", "s", true, [["", [["kep", "Kep"], ["fotr", "Fötr"], ["bere", "Bere"], ["hasir", "Hasır şapka"], ["silindir", "Silindir şapka"], ["sal", "Şal"]]]]],
		["Palto/Mont", "d", true, [["Palto", [["kisapalto", "Kısa palto"], ["uzunpalto", "Uzun palto"], ["trenc", "Trençkot"]]],
			["Mont", [["sisme", "Şişme mont"], ["deri", "Deri ceket"], ["kotceket", "Kot ceket"], ["yagmur", "Yağmurluk"]]]]],
		["Ayakkabı", "y", false, [["", [["spor", "Spor ayakkabı"], ["klasik", "Klasik ayakkabı"], ["bot", "Bot"], ["cizme", "Uzun çizme"], ["sandalet", "Sandalet"], ["topuklu", "Topuklu"]]]]],
		["Aksesuar", "x", true, [["", [["gunes", "Güneş gözlüğü"], ["gozluk", "Çerçeveli gözlük"], ["atki", "Atkı"], ["kravat", "Kravat"], ["sirt", "Sırt çantası"], ["canta", "El çantası"]]]]],
	];
	const RENKLER = [["Siyah", "#1c1c1f"], ["Beyaz", "#f7f7f4"], ["Kırmızı", "#e01b24"], ["Sarı", "#f5c400"], ["Mavi", "#1d5fd6"], ["Yeşil", "#22a03c"]];
	const GOZ = ["gunes", "gozluk"];
	const TEK = ["kisaelbise", "uzunelbise", "tulum"];
	let kSekme = 0;
	const parca = (v) => v.slice(0, -1);
	const sekmeAnahtar = (t) => [t[1], ...t[3].map((g) => g[2]).filter(Boolean)];
	function kiyCoz(s) {
		const d = { x: [] };
		for (const p of (s || "").split("|")) {
			const [k, v] = p.split(":");
			if (!v) continue;
			if (k === "x") d.x = v.split(",").filter(Boolean); else d[k] = v;
		}
		return d;
	}
	const kiyYaz = (d) => ["h", "k", "b", "u", "a", "s", "d", "y"].filter((k) => d[k]).map((k) => k + ":" + d[k]).concat(d.x.length ? ["x:" + d.x.join(",")] : []).join("|");
	const kiyBu = () => kiyCoz((window.miniakentKiyafetler || {})[karakter.toLowerCase()]);
	function kiyafetPanel() {
		const d = kiyBu(), t = KIY[kSekme];
		const secim = (k, id) => k === "x" ? (d.x.find((v) => parca(v) === id) || "") : (d[k] && parca(d[k]) === id ? d[k] : "");
		let h = `<div class="etiket">Kıyafetini seç</div><div class="sekmeler kiy-sekmeler">${KIY.map((x, i) => `<button class="${i === kSekme ? "secili" : ""}" data-ksekme="${i}">${x[0]}</button>`).join("")}</div><div class="kiyafet">`;
		const bos = t[1] === "x" ? !d.x.length : !sekmeAnahtar(t).some((k) => d[k]);
		if (t[2]) h += `<button class="kiy-yok ${bos ? "secili" : ""}" data-kyok="1">Yok</button>`;
		for (const [grup, parcalar, gk] of t[3]) {
			const k = gk || t[1];
			if (grup) h += `<div class="kiy-grup">${grup}</div>`;
			for (const [id, ad] of parcalar) {
				const s = secim(k, id);
				h += `<div class="kiy-satir ${s ? "secili" : ""}"><span>${ad}</span><div class="renkler">${(t[4] || RENKLER).map((r, i) =>
					`<button class="${s === id + i ? "secili" : ""}" style="background:${r[1]}" data-kiy="${k}|${id}${i}" aria-label="${ad}, ${r[0]}"></button>`).join("")}</div></div>`;
			}
		}
		return h + `</div><p class="bilgi">Seçtiğin kıyafet şehirde herkese görünür.</p>`;
	}
	// dokunulan renk giyilir; isteğe bağlı parçada (sakal bıyık, şapka, palto/mont, aksesuar) seçili renge yeniden
	// dokunmak çıkarır. Elbise/tulum seçilince alt kalkar; alt seçilince elbise/tulum kalkar.
	function kiySec(kv) {
		if (!window.miniakentKiyafetSec) return;
		const t = KIY[kSekme], d = kiyBu();
		if (!kv) {
			if (t[1] === "x") d.x = []; else for (const k of sekmeAnahtar(t)) d[k] = "";
		} else {
			const [k, v] = kv.split("|");
			if (k === "x") {
				const id = parca(v), vardi = d.x.includes(v);
				d.x = d.x.filter((x) => parca(x) !== id && !(GOZ.includes(id) && GOZ.includes(parca(x))));
