		<!--
		Miniakent yükleme ekranı (kullanıcı, 2026-10-20): Godot'un yükleme ekranı yerine logo ve kullanıcının
		tasarladığı ada çubuğu; ev, yükleme ilerledikçe sağa ilerler. Ziyaretçinin saatine göre 07:00–19:00
		gündüz, kalanı gece görseli. Çubuk parçaları ve logolar Web_Deneme'de (yukleme_*.webp). Oyun ilk kez
		çizilince (main.gd -> window.miniakentHazir) ekran kaybolur. Bu dosya export_presets.cfg'de
		html/custom_html_shell olarak verilir.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #ffffff;
	overflow: hidden;
	touch-action: none;
}

body.gece {
	background-color: #121a2e;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#yukleme {
	position: absolute;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 3vh;
	background-color: inherit;
	transition: opacity 0.6s ease;
}

#yukleme.bitti {
	opacity: 0;
	pointer-events: none;
}

#yukleme-logo {
	width: min(72vw, 420px);
	max-height: 46vh;
	object-fit: contain;
}

#yukleme-cubuk {
	position: relative;
	width: min(88vw, 640px);
	aspect-ratio: 1275 / 174;
}

#yukleme-cubuk img {
	position: absolute;
	top: 0;
	height: 100%;
	pointer-events: none;
	user-select: none;
}

#cubuk-bos, #cubuk-dolu {
	left: 0;
	width: 100%;
}

#cubuk-dolu {
	clip-path: inset(0 81% 0 0);
	transition: clip-path 0.45s ease-out;
}

#cubuk-ev {
	width: 12.94%;
	left: 14.7%;
	transition: left 0.45s ease-out;
	animation: sallan 1.6s ease-in-out infinite;
}

@keyframes sallan {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-3%); }
}

#yukleme-yazi {
	position: absolute;
	bottom: 2.5vh;
	left: 0;
	right: 0;
	text-align: center;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 12px;
	letter-spacing: 0.02em;
	color: #a9a9a9;
}

body.gece #yukleme-yazi {
	color: #5f6b85;
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	z-index: 11;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}

		<script>
(function () {
	// Gündüz mü gece mi: ziyaretçinin kendi saati (07:00–19:00 gündüz)
	const h = new Date().getHours();
	const zaman = (h >= 7 && h < 19) ? 'gunduz' : 'gece';
	if (zaman === 'gece') {
		document.body.classList.add('gece');
	}
	document.getElementById('yukleme-logo').src = 'yukleme_logo_' + zaman + '.webp';
	document.getElementById('cubuk-bos').src = 'yukleme_bos_' + zaman + '.webp';
	document.getElementById('cubuk-dolu').src = 'yukleme_dolu_' + zaman + '.webp';
	document.getElementById('cubuk-ev').src = 'yukleme_ev_' + zaman + '.webp';
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","mainPack":"index-v202610201702.pck","experimentalVK":false,"fileSizes":{"index-v202610201702.pck":4490560,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const yukleme = document.getElementById('yukleme');
	const dolu = document.getElementById('cubuk-dolu');
	const ev = document.getElementById('cubuk-ev');
	const statusNotice = document.getElementById('status-notice');
	// Çubuk 1700 birim: ev parçası 220 birim; solu 250'den 1380'e ilerler, dolu kısım evin altına kadar görünür.
	let shown = 0;

	function ilerle(p) {
		p = Math.max(shown, Math.min(1, p));
		shown = p;
		const x = 250 + p * 1130;
		ev.style.left = (x / 17) + '%';
		dolu.style.clipPath = 'inset(0 ' + (100 - (x + 60) / 17) + '% 0 0)';
	}

	let bitti = false;
	function kapat() {
		if (bitti) {
			return;
		}
		bitti = true;
		ilerle(1);
		setTimeout(function () {
			yukleme.classList.add('bitti');
			setTimeout(function () { yukleme.remove(); }, 700);
		}, 450);
	}
	// main.gd şehir ilk kez çizilince çağırır
	window.miniakentHazir = kapat;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		ilerle(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					ilerle(0.88 * current / total);  // indirme; kalan pay motorun açılışı ve şehrin kurulması
				}
			},
		}).then(() => {
			ilerle(0.94);
			setTimeout(kapat, 15000);  // oyundan haber gelmezse de kalkar
		}, displayFailureNotice);
	}
}());
